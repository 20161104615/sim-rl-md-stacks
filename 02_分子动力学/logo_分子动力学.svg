<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="分子动力学应用图标">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2350"/>
      <stop offset="1" stop-color="#2746B8"/>
    </linearGradient>
    <linearGradient id="mol2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CF2D6"/>
      <stop offset="1" stop-color="#13B89C"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#19E0C0" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#19E0C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方底（与机器人仿真版共用同一外框语言） -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg2)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#glow2)"/>

  <!-- 化学键（六元环 + 一支分支） -->
  <g stroke="#2A3A6B" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="152" x2="338" y2="200"/>
    <line x1="338" y1="200" x2="338" y2="288"/>
    <line x1="338" y1="288" x2="256" y2="336"/>
    <line x1="256" y1="336" x2="174" y2="288"/>
    <line x1="174" y1="288" x2="174" y2="200"/>
    <line x1="174" y1="200" x2="256" y2="152"/>
    <!-- 分支到第七个原子 -->
    <line x1="338" y1="200" x2="404" y2="166"/>
  </g>

  <!-- 原子（六元环） -->
  <g stroke="#0E3B33" stroke-width="5" fill="url(#mol2)">
    <circle cx="256" cy="152" r="24"/>
    <circle cx="338" cy="200" r="24"/>
    <circle cx="338" cy="288" r="24"/>
    <circle cx="256" cy="336" r="24"/>
    <circle cx="174" cy="288" r="24"/>
    <circle cx="174" cy="200" r="24"/>
    <!-- 第七个分支原子 -->
    <circle cx="404" cy="166" r="20"/>
  </g>

  <!-- 动力学电子云（环绕点缀） -->
  <g fill="#7CE0FF">
    <circle cx="256" cy="92" r="7"/>
    <circle cx="120" cy="318" r="7"/>
    <circle cx="392" cy="320" r="7"/>
  </g>
</svg>
